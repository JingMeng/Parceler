apply plugin: 'com.android.library'


android {
    namespace 'com.lzh.compiler.parceler'
    compileSdk 34


    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    lintOptions {
        abortOnError false
    }

}

dependencies {
    api project(':annotation')
}



